<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 420px; margin: 0; font: 13px system-ui, sans-serif; }
  h1 { margin: 0; padding: 8px; font-size: 13px; font-weight: 600; text-align: center; border-bottom: 1px solid #ccc; }
  input { box-sizing: border-box; width: 100%; padding: 8px; border: 0; outline: none; font: inherit; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 480px; overflow-y: auto; }
  li { display: flex; gap: 6px; align-items: center; padding: 5px 8px; cursor: pointer; }
  li img { width: 16px; height: 16px; flex: none; }
  li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { color: #888; margin-left: auto; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li.sel { background: #0060df; color: #fff; }
  li b { font-weight: 700; text-decoration: underline; }
  li.sel small { color: #ddd; }
</style>
<h1>Tab Filter</h1>
<input id="q" autocomplete="off" spellcheck="false" placeholder="Search open tabs" autofocus>
<ul id="list"></ul>
<script src="popup.js"></script>
